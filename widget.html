<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head><body>
<button id="b">Включить таблицу</button>
<pre id="o" style="white-space:pre-wrap;word-break:break-all;"></pre>
<script>
vkBridge.send('VKWebAppInit');
document.getElementById('b').onclick = async () => {
  const out = document.getElementById('o');
  try {
    const t = await vkBridge.send('VKWebAppGetCommunityToken',{app_id:54812484,group_id:92645165,scope:'app_widget'});
    window._tok = t.access_token;
    out.textContent = 'ПОЛНЫЙ КЛЮЧ ДЛЯ ДОМА (скопируй в дом, сюда и никому не кидай):\n' + t.access_token;
    await vkBridge.send('VKWebAppShowCommunityWidgetPreviewBox',{type:'table',group_id:92645165,code:'return {"title":"ПОКАЗАНИЯ ДОМА • Ворошилова 29/3","head":[{"text":"Что"},{"text":"Значение"}],"body":[[{"text":"ТЕМПЕРАТУРА ГОРЯЧЕЙ ВОДЫ"},{"text":"— °С"}],[{"text":"НАПРЯЖЕНИЕ В СЕТИ"},{"text":"— В"}],[{"text":"СЛЫШИМОСТЬ НАСОСА"},{"text":"— %"}]]};'});
    out.textContent += '\n\nТаблица встала. Дальше дом сам обновит цифры.';
  } catch(e){ out.textContent = 'ОШИБКА: ' + JSON.stringify(e); }
};
</script>
</body></html>
